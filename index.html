<!DOCTYPE html>
<html>
<head>
    <title>(SliST)</title>
    <link rel="icon" type="images/svg+xml" href="Slime Vector.svg"> <!-- This is also Friend -->
    <style>
        :root {
            --slime-highlight: #b1ed93;
            --slime-body: #44ca44;
            --slime-shadow: #0e8928;
            --text: #000000;
            --box-highlight: #8ef58e;
            --palette: 0;
        }
        body { font-family: Arial, sans-serif; text-align: center; background-color: #111; color: var(--slime-highlight); }
        .clock { font-size: 2em; margin: 20px; }
        input, select { margin: 5px; padding: 8px; font-size: 1em; border-radius: 10px; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .menu { margin: 20px; }        .container-box { background: linear-gradient(135deg, var(--box-highlight), var(--slime-body)); padding: 20px; border-radius: 15px; display: inline-block; color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        #dialMenu { background: none; box-shadow: none; }
        canvas { background: #111; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Universal Slime Time</h1>
    <div class="menu">
        <select id="viewSelector">
            <option value="clock">Clock</option>
            <option value="conversion">Conversion</option>
            <option value="dial">Dial View</option>
        </select>
    </div>

    <!-- Clock view -->
    <div id="clockMenu" class="container-box" style="position:relative;">
            <svg id="Friend" viewBox="0 0 250 240" class="Friend" style="position:absolute; left:10px; top:-70px; z-index: 2; height:80; width:80; cursor: grab;">
            <defs/>
            <path id="shape0" transform="matrix(1.31321419048092 0 0 1.31321419048092 7.41695530354433 54.1166745761049)" fill= var(--slime-body) stroke=var(--slime-body) stroke-width="9.6" d="M175.947 71.658C176.57 31.5112 137.749 -0.873343 87.9736 0.0179674C38.1986 0.909277 0.96 27.6583 0 71.658C0 125.738 50.5993 118.338 87.9736 118.098C125.348 117.858 175.947 125.738 175.947 71.658Z"/>
            <path id="shape01" transform="matrix(1.31321414420711 0 0 1.31321414420711 1.01877268307119 148.849281923108)" fill=var(--slime-shadow) stroke=var(--slime-shadow) d="M185.276 0C175.66 26.728 153.724 35.8226 92.8454 37.32C36.4444 38.7073 8.69169 25.279 0 0.48004C0.619024 20.8482 8.41648 35.2538 23.3924 43.6969C28.7954 45.7445 39.0869 50.0213 53.97 51.1288C78.0049 51.2321 115.68 49.9177 138.993 50.2803C170.727 46.4496 185.027 29.5242 185.276 0Z"/>
            <path id="shape02" transform="matrix(1.31321420815116 0 0 1.31321420815116 87.103728205985 72.5466998393282)" fill=var(--slime-highlight) d="M24.9612 0.00252821C5.09419 0.154632 -4.82475 17.3982 2.3067 24.6398C5.97497 28.3647 15.8859 27.327 27.1071 27.001C37.701 26.6933 49.5033 27.2882 56.9855 24.3012C69.0983 19.4655 58.7952 -0.256508 24.9612 0.00252821Z"/>
            <path id="shape1" transform="matrix(1.30416347912603 0.153912885113491 -0.153912885113491 1.30416347912603 192.262126159482 101.214200323725)" fill=var(--slime-highlight) d="M14.6372 4.40357C13.7455 2.71878 6.03363 -2.30632 1.66904 1.23697C-3.91307 5.76868 6.1696 8.86183 7.68665 9.36115C14.4478 11.5865 16.5898 8.09297 14.6372 4.40357Z"/>
            Sorry, your browser doesn't display friend...
            </svg> 
        <div class="clock" id="slimeClock"></div>
        <div class="clock" id="slimeMilitary"></div>
    </div>

    <!-- Conversion view -->
    <div id="conversionMenu" class="container-box" style="display:none;">
        <div>
            <label>Local Time: <input type="time" id="localTime"></label>
            <p id="localToSlimeResult"></p>
        </div>
        <div>
            <label>Slour (0–10): <input type="number" id="slour" min="0" max="10"></label>
            <label>Minutes (0–71): <input type="number" id="slourMin" min="0" max="71"></label>
            <select id="SlAmSlImToggle">
                <option value="0">SlAm</option>
                <option value="10">SlIm</option>
              </select>
            <p id="slimeToLocalResult"></p>
        </div>
    </div>

    <!-- Dial view -->
    <div id="dialMenu" style="display:none;">
        <canvas id="DialRenderer" width="520" height="520"></canvas>
    </div>

<script>

    var r = document.querySelector(':root');
    var rs = getComputedStyle(r);
    var slimebody = ['#44ca44', '#3767cf', '#9928a1', '#dc234a'];
    var slimehighlight = ['#b1ed93', '#a6c9f9', '#e98cf3', '#ee9bbe'];
    var slimeshadow = ['#0e8928', '#193ab4', '#651e7e', '#910f0f'];
    var box = ['#8ef58e', '#5a83db', '#e98cf3', '#ee9bbe'];
    var text = ['#000', '#000', '#000', '#000'];


    function SetColor(palette){
        r.style.setProperty('--slime-body', slimebody[palette]);
        r.style.setProperty('--slime-highlight', slimehighlight[palette]);
        r.style.setProperty('--slime-shadow', slimeshadow[palette]);
        r.style.setProperty('--text', text[palette]);
        r.style.setProperty('--box-highlight', box[palette]);
    }


    function ChangeColor() {
          var palette = parseInt(rs.getPropertyValue('--palette'));
          palette = (palette+1)%slimebody.length;

       r.style.setProperty('--palette', palette);
        SetColor(palette);
        //alert("The value of --palette is: " + rs.getPropertyValue('--palette'));
    }


    /* ==== Original clock + conversion ==== */
    function toSliST(date) {
        let utcMinutes = Math.floor(date.getUTCHours() * 60 + date.getUTCMinutes());
        let totalSlours = utcMinutes / 72;
        let slour = Math.floor(totalSlours);
        let minutesInSlour = Math.round((totalSlours - slour) * 72);
        return { slour, minutesInSlour };
    }
    function formatSliST(slour, minutes) {
        let ampm = slour < 10 ? 'SlAm' : 'SlIm';
        let displaySlour = slour % 10 ;
        return `${displaySlour}:${minutes.toString().padStart(2,'0')} ${ampm}`;
    }
    function updateClock() {
        let now = new Date();
        let slime = toSliST(now);
        document.getElementById('slimeClock').innerText = " " + formatSliST(slime.slour, slime.minutesInSlour);
        document.getElementById('slimeMilitary').innerText = `Silly Terry Slime: ${slime.slour}:${slime.minutesInSlour.toString().padStart(2,'0')}`;
    }
    function localToSliST() {
        let timeStr = document.getElementById('localTime').value;
        if (!timeStr) return;
        let [hours, minutes] = timeStr.split(":").map(Number);
        let now = new Date();
        now.setHours(hours);
        now.setMinutes(minutes);
        let slime = toSliST(now);
        document.getElementById('localToSlimeResult').innerText = formatSliST(slime.slour, slime.minutesInSlour) + ` (Military: ${slime.slour}:${slime.minutesInSlour.toString().padStart(2,'0')})`;
        document.getElementById('slour').value = slime.slour%10;
        document.getElementById('slourMin').value = slime.minutesInSlour;
        document.getElementById('SlAmSlImToggle').value = slime.slour >= 10 ? 10 : 0;
    }
    function slistToLocal() {
        let slour = parseInt(document.getElementById('slour').value)+ parseInt(document.getElementById('SlAmSlImToggle').value);
        let minutes = parseInt(document.getElementById('slourMin').value);
        if (isNaN(slour) || isNaN(minutes)) return;
        let totalMinutesUTC = slour * 72 + minutes;
        let hoursUTC = Math.floor(totalMinutesUTC / 60);
        let minsUTC = totalMinutesUTC % 60;
        let now = new Date();
        let offsetMinutes = now.getTimezoneOffset();
        let localMinutes = (hoursUTC * 60 + minsUTC - offsetMinutes + 1440) % 1440;
        let localHours = Math.floor(localMinutes / 60);
        let localMins = localMinutes % 60;
        document.getElementById('slimeToLocalResult').innerText = `${(localHours%12||12).toString().padStart(2,'0')}:${localMins.toString().padStart(2,'0') + (localHours >= 12 ? " PM":" AM")}`;
    }

    /* ==== Dial code merged from second HTML ==== */
    const innerCanvas = document.getElementById('DialRenderer');
    const innerCtx = innerCanvas.getContext('2d');
    const centerX = innerCanvas.width / 2;
    const centerY = innerCanvas.height / 2;

    function drawHalfRing(ctx, radius, thickness, startAngle, color) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, startAngle, startAngle + Math.PI, false);
        ctx.arc(centerX, centerY, radius - thickness, startAngle + Math.PI, startAngle, true);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawInnerDial(offsetDegrees = 0) {
        innerCtx.save();
        innerCtx.translate(centerX, centerY);
        innerCtx.rotate((offsetDegrees * Math.PI) / 180);
        innerCtx.translate(-centerX, -centerY);
        drawHalfRing(innerCtx, 170, 30, -Math.PI/2, 'rgb(19, 83, 25)');
        drawHalfRing(innerCtx, 170, 30, Math.PI/2, 'rgb(57, 19, 83)');
        innerCtx.strokeStyle = '#ccc';
        innerCtx.lineWidth = 1.5;
        innerCtx.font = '14px Arial';
        innerCtx.textAlign = 'center';
        innerCtx.textBaseline = 'middle';
        for(let i = 0; i < 20; i++) {
            let angle = (i / 20) * 2 * Math.PI - Math.PI/2;
            let outerRadius = 170;
            let innerRadius = i % 5 === 0 ? outerRadius - 20 : outerRadius - 5;
            let x1 = centerX + outerRadius * Math.cos(angle);
            let y1 = centerY + outerRadius * Math.sin(angle);
            let x2 = centerX + innerRadius * Math.cos(angle);
            let y2 = centerY + innerRadius * Math.sin(angle);
            innerCtx.beginPath();
            innerCtx.moveTo(x1, y1);
            innerCtx.lineTo(x2, y2);
            innerCtx.stroke();
        }
        for(let i = 0; i < 20; i++) {
            let angle = (i / 20) * 2 * Math.PI - Math.PI/2;
            let labelRadius = 125;
            let lx = centerX + labelRadius * Math.cos(angle);
            let ly = centerY + labelRadius * Math.sin(angle);
            innerCtx.fillStyle = '#ccc';
            innerCtx.font = i % 5 === 0 ? 'bold 16px Arial' : '12px Arial';
            let numberText = i % 10 === 0 ? 10 : i % 10;
            innerCtx.fillText(numberText, lx, ly);
        }
        innerCtx.font = '20px Arial';
        innerCtx.fillStyle = 'rgba(0, 255, 100, 0.8)';
        innerCtx.fillText('SlAm', centerX + 80, centerY);
        innerCtx.fillStyle = 'rgba(150, 0, 255, 0.8)';
        innerCtx.fillText('SlIm', centerX - 80, centerY);
        innerCtx.restore();


        drawHalfRing(innerCtx, 215, 40, -Math.PI/2, 'rgb(128, 112, 20)');
        drawHalfRing(innerCtx, 215, 40, Math.PI/2, 'rgb(30, 45, 105)');
        innerCtx.strokeStyle = '#eee';
        innerCtx.lineWidth = 2;
        for (let i = 0; i < 24; i++) {
            let angle = (i / 24) * 2 * Math.PI - Math.PI/2;
            let outerRadius = 215;
            let innerRadius = i % 3 === 0 ? outerRadius - 25 : outerRadius - 2;
            let x1 = centerX + outerRadius * Math.cos(angle);
            let y1 = centerY + outerRadius * Math.sin(angle);
            let x2 = centerX + innerRadius * Math.cos(angle);
            let y2 = centerY + innerRadius * Math.sin(angle);
            innerCtx.beginPath();
            innerCtx.moveTo(x1, y1);
            innerCtx.lineTo(x2, y2);
            innerCtx.stroke();
        }
        innerCtx.fillStyle = '#eee';
        innerCtx.textAlign = 'center';
        innerCtx.textBaseline = 'middle';
        for (let i = 0; i < 24; i++) {
            innerCtx.font = i % 3 === 0 ? '28px Arial' : '18px Arial';
            let angle = (i / 24) * 2 * Math.PI - Math.PI/2;
            let labelRadius = 240;
            let lx = centerX + labelRadius * Math.cos(angle);
            let ly = centerY + labelRadius * Math.sin(angle);
            let hour12 = i % 12 === 0 ? 12 : i % 12;
            innerCtx.fillText(hour12, lx, ly);
        }
        innerCtx.font = '28px Arial';
        innerCtx.fillStyle = 'rgba(255, 223, 0, 0.8)';
        innerCtx.fillText('AM', centerX + 230, centerY - 200);
        innerCtx.fillStyle = 'rgba(0, 123, 255, 0.8)';
        innerCtx.fillText('PM', centerX - 230, centerY - 200);
    }

    function TimeZoneCheck() {
        innerCtx.clearRect(0, 0, innerCanvas.width, innerCanvas.height);
        drawHalfRing(innerCtx, 222, 87, Math.PI, 'rgba(25, 25, 25)');
        drawHalfRing(innerCtx, 222, 87, 0, 'rgb(25, 25, 25)');
        const tzOffsetMins = new Date().getTimezoneOffset();
        let offsetDegrees = -tzOffsetMins * 0.25;
        drawInnerDial(offsetDegrees);
    }

    /* ==== View switching ==== */
    document.getElementById('viewSelector').addEventListener('change', e => {
        let clockMenu = document.getElementById('clockMenu');
        let conversionMenu = document.getElementById('conversionMenu');
        let dialMenu = document.getElementById('dialMenu');
        clockMenu.style.display = 'none';
        conversionMenu.style.display = 'none';
        dialMenu.style.display = 'none';
        if (e.target.value === 'clock') {
            clockMenu.style.display = 'inline-block';
        } else if (e.target.value === 'conversion') {
            conversionMenu.style.display = 'inline-block';
            if (!document.getElementById('localTime').value) {
                let now = new Date();
                document.getElementById('localTime').value = now.toTimeString().slice(0,5);
            }
            localToSliST();
            slistToLocal();
        } else if (e.target.value === 'dial') {
            dialMenu.style.display = 'inline-block';
            TimeZoneCheck();
        }
    });

    document.getElementById('localTime').addEventListener('input', localToSliST);
    document.getElementById('slour').addEventListener('input', slistToLocal);
    document.getElementById('slourMin').addEventListener('input', slistToLocal);
    document.getElementById('SlAmSlImToggle').addEventListener('input', slistToLocal);

    document.addEventListener('click', function (event) {
    if (!event.target.closest('.Friend')) return;
    ChangeColor();
}, false);

    setInterval(updateClock, 1000);
    updateClock();
    window.onload = () => {
        let now = new Date();
        document.getElementById('localTime').value = now.toTimeString().slice(0,5);
    };

    setInterval(TimeZoneCheck, 60000);
</script>
</body>
</html>
