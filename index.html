<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UST to Custom Time Conversion</title>

    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        h1 { margin: 10px 0; font-size: 2rem; color: #333; }
        p { font-size: 1.5rem; color: #555; }
        .time-container { margin: 20px; padding: 20px; border: 2px solid #ddd; border-radius: 8px; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center; }
        select, input { margin: 5px; font-size: 1.2rem; padding: 5px; }
        .conversion-section { display: none; text-align: center; }
        .conversion-row { display: flex; justify-content: center; align-items: center; }
        .conversion-row input { width: 60px; }
        .conversion-row span { margin: 0 10px; font-size: 1.2rem; }
        #manualConversionSection p { font-size: 1.2rem; color: #333; }
    </style>
</head>
<body>
    <select id="timeFormatSelector">
        <option value="nonMilitary">Default</option>
        <option value="military">Silly Terry Slime</option>
        <option value="manual">Manual Conversion</option>
    </select>

    <div id="timeContainer" class="time-container">
        <h1>Slime Time (SliST)</h1>
        <p id="customTime"></p>

        <!-- Manual Conversion Section -->
        <div id="manualConversionSection" class="conversion-section">
            <div class="conversion-row">
                <input type="number" id="hourInput" min="0" max="12" placeholder="Hour">
                <span>:</span>
                <input type="number" id="minuteInput" min="0" max="71" placeholder="Minute">
                <span>:</span>
                <input type="number" id="secondInput" min="0" max="59" placeholder="Second">
                <span>:</span>
                <select id="modeSelector">
                    <option value="LTZ-SlAm">AM</option>
                    <option value="LTZ-SlIm">PM</option>
                    <option value="SliST-AM">SlAm</option>
                    <option value="SliST-PM">SlIm</option>
                </select>
            </div>
            <p id="manualConversionResult"></p>
        </div>

        <div id="manualConversionSection2" class="conversion-section">
            <p id="displacementDisplay"></p>
        </div>
    </div>

<script>
    const selectors = {
        timeFormat: document.getElementById('timeFormatSelector'),
        hourInput: document.getElementById('hourInput'),
        minuteInput: document.getElementById('minuteInput'),
        secondInput: document.getElementById('secondInput'),
        modeSelector: document.getElementById('modeSelector'),
        customTime: document.getElementById('customTime'),
        manualConversionSection: document.getElementById('manualConversionSection'),
        manualConversionResult: document.getElementById('manualConversionResult'),
        displacementDisplay: document.getElementById('displacementDisplay'),
        manualConversionSection2: document.getElementById('manualConversionSection2'),
    };

    let timeZoneOffset = 0;

    // Function to update the displacement text
    const updateDisplacement = () => {
        const now = new Date();
        const displacement = now.getTimezoneOffset(); // This returns the displacement in minutes;
    };

    const updateManualConversion = () => {
        const hour = parseInt(selectors.hourInput.value) || 0;
        const minute = parseInt(selectors.minuteInput.value) || 0;
        const second = parseInt(selectors.secondInput.value) || 0;
        const mode = selectors.modeSelector.value;

        let totalMinutes;
        let convertedHour, convertedMinute;

        // Get the displacement value dynamically
        const displacement = new Date().getTimezoneOffset(); // This returns the displacement in minutes

        // Conversion logic based on SliST or LTZ
        if (mode === 'SliST-AM' || mode === 'SliST-PM') {
            // Add 720 minutes for AM/PM modes
            totalMinutes = (hour * 72) + minute + 720 - displacement;

            // Ensure the total minutes stay within 0-1440
            totalMinutes = ((totalMinutes % 1440) + 1440) % 1440; // This handles both positive and negative overflow

            // Convert back to hours and minutes
            convertedHour = Math.floor(totalMinutes / 60); // 60 minutes per hour
            convertedMinute = totalMinutes % 60;
        } else if (mode === 'LTZ-SlAm' || mode === 'LTZ-SlIm') {
            // Add 720 minutes for SlAm/SlIm modes
            totalMinutes = (hour * 60) + minute + 720 + displacement;

            // Ensure the total minutes stay within 0-1440
            totalMinutes = ((totalMinutes % 1440) + 1440) % 1440; // This handles both positive and negative overflow

            // Convert back to hours and minutes
            convertedHour = Math.floor(totalMinutes / 72); // 72 minutes per hour in LTZ mode
            convertedMinute = totalMinutes % 72;
        }

        // Display based on mode
        if (mode === 'SliST-AM' || mode === 'SliST-PM') {
            // In SliST mode, display hour in 12-hour format with AM/PM
            const period = mode === 'SliST-AM' ? 'AM' : 'PM';
            const displayHour = convertedHour % 12 || 12; // Convert to 12-hour format
            selectors.manualConversionResult.textContent = `${displayHour}:${String(convertedMinute).padStart(2, '0')} ${period}`;
        } else if (mode === 'LTZ-SlAm' || mode === 'LTZ-SlIm') {
            // In LTZ mode, use "SlIm" or "SlAm" based on the hour value
            const period = mode === 'LTZ-SlIm' ? 'SlIm' : 'SlAm';
            const displayHour = convertedHour % 10; // Display the hour with modulo 10
            selectors.manualConversionResult.textContent = `${String(displayHour).padStart(2, '0')}:${String(convertedMinute).padStart(2, '0')} ${period}`;
        }
    };


let isFirstConversion = true; // Track first entry into conversion mode

const setDefaultConversionValues = () => {
    if (isFirstConversion) {
        const now = new Date();
        const hour = now.getHours() % 12 || 12; // 12-hour format
        const minute = now.getMinutes();
        const period = now.getHours() >= 12 ? 'LTZ-SlIm' : 'LTZ-SlAm'; // Default mode

        selectors.hourInput.value = hour;
        selectors.minuteInput.value = minute;
        selectors.secondInput.value = 0; // Default to 00 seconds
        selectors.modeSelector.value = period;

        updateManualConversion(); // Trigger the output immediately
        isFirstConversion = false; // Ensure this runs only once
    }
};

const updateUI = () => {
    const isManual = selectors.timeFormat.value === 'manual';

    if (isManual) {
        setDefaultConversionValues(); // Pre-fill fields on first access
    }

    selectors.manualConversionSection.style.display = isManual ? 'block' : 'none';
    selectors.customTime.style.display = isManual ? 'none' : 'block';
    selectors.manualConversionSection2.style.display = isManual ? 'block' : 'none';

    if (!isManual) {
        const now = new Date();
        let totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
        const totalMinutesFloored = Math.floor(totalMinutes / 1440);
        totalMinutes -= totalMinutesFloored * 1440;

        const customHour = Math.floor(totalMinutes / 72); 
        const customMinute = totalMinutes % 72;
        const customSecond = now.getUTCSeconds(); // Getting the current second
        const format = selectors.timeFormat.value;

        if (format === 'military') {
            // Display time in military format including seconds
            selectors.customTime.textContent = 
                `${String(customHour).padStart(2, '0')}:${String(customMinute).padStart(2, '0')}:` + 
                `${String(customSecond).padStart(2, '0')} (Military)`;
        } else if (format === 'nonMilitary') {
            const period = customHour >= 10 ? 'SlIm' : 'SlAm';
            const displayHour = customHour % 10;
            // Display time with seconds in non-military format
            selectors.customTime.textContent = 
                `${String(displayHour).padStart(2, '0')}:${String(customMinute).padStart(2, '0')}:` + 
                `${String(customSecond).padStart(2, '0')} ${period}`; // Including seconds
        }
    }

    updateDisplacement();
};


    // Function to calculate time zone offset
    const calculateTimeZoneOffset = () => {
        const localTime = new Date();
        const utcTime = new Date(localTime.toISOString());
        timeZoneOffset = (localTime - utcTime) / (1000 * 60); // Get offset in minutes
        updateUI(); // Ensure UI is updated after calculating offset
    };

    window.onload = () => {
        calculateTimeZoneOffset();
        setInterval(updateUI, 1000); // Update every second
    };

    // Event listeners
    ['hourInput', 'minuteInput', 'secondInput', 'modeSelector'].forEach(id => {
        selectors[id].addEventListener('input', updateManualConversion);
    });
    selectors.timeFormat.addEventListener('change', updateUI);
</script>

</body>
</html>
